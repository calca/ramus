[package]
name = "ramus-mcp"
version = "0.1.0"
edition.workspace = true

[dependencies]
ramus-core = { path = "../ramus-core" }
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

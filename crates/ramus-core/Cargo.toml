[package]
name = "ramus-core"
version = "0.1.0"
edition.workspace = true

# ramus-core non dipende da Tauri (vedi CLAUDE.md): compila e si testa da solo.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
thiserror = "1"
dirs = "5"
# chrono (clock): la data "oggi" del journal deve essere quella del calendario
# locale dell'utente, non UTC. La stdlib non espone il fuso orario locale su
# nessuna delle piattaforme target: senza una libreria l'app aprirebbe il
# giorno sbagliato vicino alla mezzanotte per gli utenti fuori UTC.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# rusqlite (indice locale pagine/blocchi/link/tag, M2 di SPEC.md): pre-approvata
# nella sezione Stack di SPEC.md. `bundled` compila sqlite3 in-process, niente
# libreria di sistema da richiedere all'utente.
rusqlite = { version = "0.40", features = ["bundled"] }

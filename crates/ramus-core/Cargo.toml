[package]
name = "ramus-core"
version = "0.1.0"
edition.workspace = true

# ramus-core non dipende da Tauri (vedi CLAUDE.md): compila e si testa da solo.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
thiserror = "1"
dirs = "5"
# chrono (clock): la data "oggi" del journal deve essere quella del calendario
# locale dell'utente, non UTC. La stdlib non espone il fuso orario locale su
# nessuna delle piattaforme target: senza una libreria l'app aprirebbe il
# giorno sbagliato vicino alla mezzanotte per gli utenti fuori UTC.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# rusqlite (indice locale pagine/blocchi/link/tag, M2 di SPEC.md): pre-approvata
# nella sezione Stack di SPEC.md. `bundled` compila sqlite3 in-process, niente
# libreria di sistema da richiedere all'utente.
rusqlite = { version = "0.40", features = ["bundled"] }
# tantivy (ricerca full-text, M2 di SPEC.md — nominata esplicitamente nella
# milestone, non solo "un motore di ricerca"): tokenizzazione, ranking per
# rilevanza e snippet con evidenziazione già pronti, inutile reimplementarli
# a mano come si fa per i parser del formato su disco.
tantivy = "0.26"
# git2 (sync Git, M3 di SPEC.md): verificato contro gitoxide (gix) — gix non
# espone ancora un push funzionante nel crate principale, git2 (binding a
# libgit2) ha fetch/push/merge_analysis/credenziali completi e maturi.
# vendored-libgit2/vendored-openssl: nessuna libreria di sistema richiesta
# all'utente, stesso principio di rusqlite's `bundled`.
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }

[package]
name = "ramus"
version = "0.1.0"
description = "Ramus — outliner a blocchi su file markdown locali"
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ramus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
ramus-core = { path = "../crates/ramus-core" }
# Calcolo dei path di default (vault, config.json) su desktop — spostato qui
# da ramus-core (M6): il crate core non deve sapere nulla di piattaforme
# (CLAUDE.md regola 1), il guscio Tauri sì (via `dirs` su desktop, via
# `app.path()` su mobile).
dirs = "5"
# tokio::time::interval per il task di sync Git automatico (M3): Tauri gira
# già su un runtime Tokio (tauri::async_runtime), serve solo il tipo per
# usarne l'API di timing direttamente — nessun runtime nuovo da avviare.
tokio = { version = "1", features = ["time"] }


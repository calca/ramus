name: test

# Stessa checklist di CLAUDE.md ("prima di dichiarare finito un
# task"), automatizzata invece che eseguita a mano. Solo Ubuntu: i
# test coprono logica pura (ramus-core/ramus-mcp) e la parte
# TypeScript, nessuna delle due ha comportamento OS-specifico da
# verificare qui — vedi specs/release/2026-09-03-ci.TODO.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Librerie di sistema richieste per compilare il crate Tauri
      # (src-tauri) su Linux — elenco ufficiale dei prerequisiti Tauri
      # v2 per Ubuntu.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run test
        run: npm run test
